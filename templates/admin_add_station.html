<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Station - EV Charge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "_navbar.html" %}
    <main class="page-container">
        <form class="form-card" method="post">
            <h1>➕ Add Charging Station</h1>
            <label for="station_name">Station Name</label>
            <input id="station_name" name="station_name" type="text" required>
            <label for="location">Location</label>
            <input id="location" name="location" type="text" required>
            <label for="contact_number">Contact Number</label>
            <input id="contact_number" name="contact_number" type="tel">
            <div class="form-actions">
                <button class="btn" type="submit">Add Station</button>
                <a class="back-link" href="/admin/stations">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
